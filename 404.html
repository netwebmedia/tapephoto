<!DOCTYPE html>

<style>
  /* Palette mirrors style.css :root, inlined on purpose: a 404 is served for
     arbitrary paths, so a relative stylesheet URL would resolve against the
     wrong directory. This page carries no inline JS. */
  :root{--white:#FFFFFF;--black:#0A0A0A;--gray-100:#F5F5F5;--gray-200:#E5E5E5;
        --gray-400:#999;--gray-600:#666;
        --serif:'Playfair Display',Georgia,serif;
        --sans:Inter,-apple-system,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;background:var(--black);
       color:var(--white);font-family:var(--sans);line-height:1.6;text-align:center;
       padding:24px;-webkit-font-smoothing:antialiased}
  .code{font-family:var(--serif);font-size:96px;font-weight:400;font-style:italic;
        line-height:1;letter-spacing:-.02em}
  h1{font-family:var(--serif);font-size:24px;font-weight:400;margin:14px 0 8px;
     letter-spacing:.01em}
  p{color:var(--gray-400);max-width:46ch;margin:0 auto 24px;font-weight:300}
  a.btn{display:inline-block;background:var(--white);color:var(--black);font-weight:500;
        font-size:13px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
        padding:13px 26px;margin:6px 6px 0;transition:opacity .3s var(--ease,ease)}
  a.btn:hover{opacity:.82}
  a.alt{display:inline-block;color:var(--white);font-weight:400;font-size:13px;
        letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
        padding:13px 24px;border:1px solid rgba(255,255,255,.28);margin:6px 6px 0}
  a.alt:hover{border-color:var(--white)}
  nav.more{margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);
           color:var(--gray-600);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
           line-height:2.4}
  nav.more a{color:var(--gray-400);text-decoration:none;margin:0 10px;white-space:nowrap}
  nav.more a:hover{color:var(--white)}
</style>
</head>
